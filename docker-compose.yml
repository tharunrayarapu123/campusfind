services:
  mysql:
    image: mysql:8.0
    container_name: campusfind-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+00:00'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusfind}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-campususer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campuspassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - campusfind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  campusfind_mysql_data:
    name: campusfind_mysql_data
