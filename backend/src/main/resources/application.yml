spring:
  application:
    name: campusfind-backend
  profiles:
    active: dev
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

# Application & Feature Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:college.edu}
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  cloudinary:
    url: ${CLOUDINARY_URL:}
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  matching:
    threshold: 50
    weights:
      block: 25
      room: 25
      category: 20
      time: 10
      text: 10
      image: 10

# Gemini AI API Configuration
gemini:
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  api-key: ${GEMINI_API_KEY:}
  vision-model: ${GEMINI_VISION_MODEL:gemini-1.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
  enabled: ${GEMINI_ENABLED:}

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always

# Resilience4j configurations for Gemini API
resilience4j:
  retry:
    instances:
      geminiClient:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException.TooManyRequests
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  circuitbreaker:
    instances:
      geminiClient:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2


---
# Dev Profile (MySQL 8 Docker Container / Local MySQL Service)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusfind?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:campususer}
    password: ${DB_PASSWORD:campuspassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

---
# Standalone / Local Profile (In-Memory MySQL Mode for local dev testing without active Docker daemon)
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:campusfind;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

---
# Prod Profile (Production Cloud / Clustered MySQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
